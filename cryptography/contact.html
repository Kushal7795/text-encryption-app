    body {

      overflow-x: hidden;
    }

    header {
      background-color: #111;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 0 15px #00ff88;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo-placeholder {
      height: 40px;
      width: 120px;
      background: linear-gradient(90deg, #00ff88, #00ffaa);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
      font-size: 1rem;
    }

    nav a {
      color: #00ff88;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #ffffff;
    }

    h1 {
      text-align: center;
      margin: 2rem 0 1rem;
      font-size: 2.5rem;
      color: #00ffaa;
    }

    .glow-text {
      color: #00ffcc;
      text-shadow:
        0 0 2px #00ffcc,
        0 0 4px #00ffcc;
      transition: transform 0.2s ease-out;
      will-change: transform;
      white-space: nowrap;
      user-select: none;
      pointer-events: none;
    }

    .background-glow::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0, 255, 0, 0.1), transparent 60%);
      animation: pulse 5s infinite ease-in-out;
      z-index: 0;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.2;
      }
      50% {
        transform: scale(1.1);
        opacity: 0.3;
      }
    }

    .intro {
      text-align: center;
      max-width: 900px;
      margin: 0 auto 3rem;
      font-size: 1.1rem;
      color: #c1fce5;
      padding: 0 1rem;
    }

    footer {
      background-color: #111;
      color: #00ff88;
      padding: 2rem;
      text-align: center;
      border-top: 2px solid #00ff88;
      box-shadow: 0 -5px 15px #00ff88;
    }

    .social-icons {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .social-icons a {
      color: #00ff88;
      font-size: 1.8rem;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .social-icons a:hover {

    }

    .footer-text {

    }

    .hero {
